<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1000" viewBox="0 0 1400 1000">
<style>text{font-family:Arial,sans-serif;fill:#14222d;font-size:17px}.small{font-size:14px}.title{font-size:25px;font-weight:bold}.box{fill:#f4f7fa;stroke:#385267;stroke-width:2}.power{fill:none;stroke:#c74432;stroke-width:4}.signal{fill:none;stroke:#287fa0;stroke-width:3}.gnd{fill:none;stroke:#404040;stroke-width:3;stroke-dasharray:8 5}.label{font-weight:bold}</style>
<rect width="1400" height="1000" fill="white"/>
<text x="35" y="40" class="title">B.G.D baseline R1.1 — electrical topology</text>
<text x="35" y="67">DESIGN FOR REVIEW · NOT RELEASED · Logical schematic, not to scale · CSV controls individual pins, lengths and joints</text>
<rect x="35" y="95" width="260" height="90" rx="8" class="box"/><text x="50" y="124" class="label">Nexus 6S2P / QS8</text><text x="50" y="150">Factory pack + bare QS8 male</text><text x="50" y="172" class="small">25.2V maximum / custom8AWG</text>
<rect x="345" y="95" width="230" height="90" rx="8" class="box"/><text x="360" y="124" class="label">INA-BM</text><text x="360" y="150">BAT+ → shunt → ESC+</text><text x="360" y="172" class="small">Negative bypasses shunt</text>
<rect x="625" y="95" width="295" height="90" rx="8" class="box"/><text x="640" y="124" class="label">Guarded C110 + / − buses</text><text x="640" y="150">J1 input / J2 AIO / J3 branches</text><text x="640" y="172" class="small">No carbon contact; load clamps</text>
<path class="power" d="M295 130H345M575 130H625"/><path class="gnd" d="M295 165H325V199H600V165H625"/>
<rect x="1010" y="95" width="345" height="130" rx="8" class="box"/><text x="1025" y="124" class="label">MicoAir743v2 AIO45A</text><text x="1025" y="150">10AWG feed / local35V1000µF</text><text x="1025" y="176">4 ESCs → four XING2809 motors</text><text x="1025" y="202" class="small">Motor mapping / pad fit remain gates</text><path class="power" d="M920 130H1010"/><path class="gnd" d="M920 165H1010"/>
<rect x="35" y="280" width="340" height="110" rx="8" class="box"/><text x="50" y="309" class="label">F1 5A → Matek BEC12S-PRO</text><text x="50" y="335">5.2V → Pi2/4 via equal22AWG</text><text x="50" y="360">Returns → Pi6/9; no USB-C source</text><text x="50" y="382" class="small">18AWG trunks; clamp before header</text>
<rect x="415" y="280" width="350" height="110" rx="8" class="box"/><text x="430" y="309" class="label">F2 5A → Hobbywing UBEC5A</text><text x="430" y="335">5.0V peripheral star</text><text x="430" y="360">Servos / lights / U1 / release</text><text x="430" y="382" class="small">Never parallel outputs with Pi/AIO</text>
<path class="power" d="M690 185V245H200V280M720 185V255H590V280"/>
<rect x="805" y="280" width="550" height="110" rx="8" class="box"/><text x="820" y="309" class="label">AIO regulated sensors / IR</text><text x="820" y="335">5V: RP1, M10, TFmini-S, INA logic, Finder2</text><text x="820" y="360">12V → DFR1015 set3.3V → two IR BoardB</text><text x="820" y="382" class="small">TFmini at connector must stay4.9–5.1V; no Camera3 screw power</text><path class="power" d="M1180 225V280"/>
<rect x="35" y="435" width="340" height="220" rx="8" class="box"/><text x="50" y="464" class="label">Pi4 + #2310 carrier</text><text x="50" y="492">CSI → Camera3 (300mmFPC)</text><text x="50" y="520">USB → D500 (500mmA–MicroB)</text><text x="50" y="548">GPIO14/15 ↔ FC UART1</text><text x="50" y="576">GPIO18 → U1 LED channel</text><text x="50" y="604">GPIO23/24 ← safe-state switches</text><text x="50" y="632" class="small">PWM audio OFF; fan continuously supplied</text><path class="power" d="M200 390V435"/>
<rect x="415" y="435" width="460" height="220" rx="8" class="box"/><text x="430" y="464" class="label">U1 SN74AHCT125N / peripheral5V</text><text x="430" y="492">14=VCC / 7=GND / OE1,4,10,13=GND</text><text x="430" y="520">Pi GPIO18 → 2 → 3 → 330Ω → LED DIN</text><text x="430" y="548">FC M7 → 5 → 6 → release RC IN</text><text x="430" y="576">FC M5 → 9 → 8 → pan signal</text><text x="430" y="604">FC M6 → 12 → 11 → tilt signal</text><text x="430" y="632" class="small">10k input pull-downs; local100nF; separated5V islands</text><path class="power" d="M590 390V435"/><path class="signal" d="M375 575H415"/>
<rect x="915" y="435" width="440" height="220" rx="8" class="box"/><text x="930" y="464" class="label">FC resource allocation</text><text x="930" y="492">UART1 Pi / UART3 M10</text><text x="930" y="520">UART4 TFmini / UART6 RP1 CRSF</text><text x="930" y="548">I2C1 INA0x45 + IST8310 0x0E</text><text x="930" y="576">M1–4 motors / M5–6 pan–tilt</text><text x="930" y="604">M7 release / M8 + LED unconnected</text><text x="930" y="632" class="small">Cross TX/RX; no5V to Pi or FC GPIO</text><path class="signal" d="M915 548H875"/>
<rect x="35" y="720" width="450" height="205" rx="8" class="box"/><text x="50" y="749" class="label">Two aircraft-mounted switches</text><text x="50" y="777">COM → GND; NO → 330Ω → GPIO</text><text x="50" y="805">4.7k pull-up to Pi3.3V;100nF filter</text><text x="50" y="833">A: seated holder AND closed lid tongue</text><text x="50" y="861">B: bolt fully through aligned strike</text><text x="50" y="889" class="small">Open wire unsafe; short-to-GND not fully diagnosed</text><text x="50" y="913" class="small">Absent/partial holder, open lid and partial bolt fixture tests</text><path class="signal" d="M200 655V720"/>
<rect x="535" y="720" width="465" height="205" rx="8" class="box"/><text x="550" y="749" class="label">Pololu2802 → removable-holder solenoid</text><text x="550" y="777">VCC and LOAD HIGH → peripheral5V</text><text x="550" y="805">GND → star; LOAD LOW → coil negative</text><text x="550" y="833">RCY2180/2181 keyed2pin disconnect</text><text x="550" y="861">Both power bridges OPEN; VRC unused</text><text x="550" y="889" class="small">1000µs OFF / 2000µs ON;50Hz; bounded release</text><text x="550" y="913" class="small">Safe-start cannot reject a continuing stale ON waveform</text><path class="signal" d="M720 655V720"/>
<rect x="1040" y="720" width="315" height="205" rx="8" class="box"/><text x="1055" y="749" class="label">Peripheral loads</text><text x="1055" y="777">Pan + tilt separately powered</text><text x="1055" y="805">LED1 OUT → LED2 IN</text><text x="1055" y="833">First lamp:1000µF10V</text><text x="1055" y="861">Grounds common; outputs separate</text><text x="1055" y="889" class="small">No breadboard / no loose Dupont</text><text x="1055" y="913" class="small">Load, thermal and brownout tests pending</text>
<text x="35" y="968" class="small">Red: supply topology · Blue: data/control · Dashed: main negative bypass · Ground returns required for every load (see CSV) · Read electrical-build.md before use</text>
</svg>

